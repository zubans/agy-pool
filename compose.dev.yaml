# Локальная разработка: публикует порты app, postgres и nats на хосте.
# Запуск: make up-dev (то же, что docker compose -f compose.yaml -f compose.dev.yaml up -d --build --wait).
# Порты привязаны только к 127.0.0.1: у сервиса нет авторизации на служебных адресах,
# а у postgres и nats — учётные данные для разработки; из сети они не должны быть видны.
# Номера портов меняются переменными AGY_DEV_*_PORT в .env, если на хосте они заняты.

services:
  app:
    ports:
      - "127.0.0.1:${AGY_DEV_HTTP_PORT:-8080}:8080"
    environment:
      AGY_LOG_LEVEL: debug

  postgres:
    ports:
      - "127.0.0.1:${AGY_DEV_PG_PORT:-5432}:5432"

  nats:
    ports:
      - "127.0.0.1:${AGY_DEV_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${AGY_DEV_NATS_MON_PORT:-8222}:8222"
